<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <style>
    .bg { fill: #fcfcfb; }
    .t { fill: #0b0b0b; }
    .t2 { fill: #52514e; }
    .grid { stroke: #e4e3df; stroke-width: 1; }
    .df { stroke: #2a78d6; }
    .mtp { stroke: #eb6834; }
    .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .base { stroke: #8a8984; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .dot { stroke: #fcfcfb; stroke-width: 2; }
    .ddf { fill: #2a78d6; }
    .dmtp { fill: #eb6834; }
    .dbase { fill: #8a8984; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .t { fill: #ffffff; }
      .t2 { fill: #c3c2b7; }
      .grid { stroke: #383835; }
      .df { stroke: #3987e5; }
      .mtp { stroke: #d95926; }
      .base { stroke: #8f8e87; }
      .dot { stroke: #1a1a19; }
      .ddf { fill: #3987e5; }
      .dmtp { fill: #d95926; }
      .dbase { fill: #8f8e87; }
    }
  </style>
  <rect class="bg" width="980" height="330"/>

  <!-- легенда -->
  <g transform="translate(60,18)">
    <line x1="0" y1="0" x2="18" y2="0" class="line df"/><circle cx="9" cy="0" r="4" class="dot ddf"/>
    <text x="24" y="4" class="t">DFlash2 7</text>
    <line x1="100" y1="0" x2="118" y2="0" class="line mtp"/><circle cx="109" cy="0" r="4" class="dot dmtp"/>
    <text x="124" y="4" class="t">MTP 3</text>
    <line x1="185" y1="0" x2="203" y2="0" class="base"/><circle cx="194" cy="0" r="4" class="dot dbase"/>
    <text x="209" y="4" class="t">без спекуляции</text>
    <text x="330" y="4" class="t2">генерация, т/с · 500 токенов после холодного предзаполнения · шкала общая</text>
  </g>

