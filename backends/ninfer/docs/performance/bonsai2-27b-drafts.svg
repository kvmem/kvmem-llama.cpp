    <polyline class="line code" points="60,157.8 120,151.7 180,146.4 240,135.6 300,134.0 360,168.3 420,164.6"/>
    <polyline class="line prose" points="60,192.5 120,192.3 180,197.1 240,196.4 300,196.4 360,211.2 420,212.6"/>
