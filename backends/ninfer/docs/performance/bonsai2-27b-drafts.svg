    <rect x="330" y="40" width="100" height="210" class="shade"/>
    <text x="380" y="56" class="t2" text-anchor="middle">обрыв</text>
    <g class="grid">
      <line x1="60" y1="250" x2="430" y2="250"/><line x1="60" y1="209.6" x2="430" y2="209.6"/>
      <line x1="60" y1="169.2" x2="430" y2="169.2"/><line x1="60" y1="128.8" x2="430" y2="128.8"/>
      <line x1="60" y1="88.5" x2="430" y2="88.5"/><line x1="60" y1="48.1" x2="430" y2="48.1"/>
    </g>
    <g class="t2" text-anchor="end">
      <text x="52" y="254">0</text><text x="52" y="213.6">50</text><text x="52" y="173.2">100</text>
      <text x="52" y="132.8">150</text><text x="52" y="92.5">200</text><text x="52" y="52.1">250</text>
    </g>
    <g class="t2" text-anchor="middle">
      <text x="60" y="268">3</text><text x="120" y="268">4</text><text x="180" y="268">5</text><text x="240" y="268">6</text>
      <text x="300" y="268">7</text><text x="360" y="268">8</text><text x="420" y="268">9</text>
      <text x="240" y="286">черновиков DFlash2</text>
    </g>
