    <polyline class="line code" points="60,67.8 120,47.7 180,58.7 240,53.7 300,56.3 360,84.1 420,88.2"/>
    <polyline class="line prose" points="60,139.9 120,148.6 180,144.3 240,146.1 300,145.0 360,172.3 420,172.9"/>
    <g class="dot dcode">
      <circle cx="60" cy="67.8" r="4"/><circle cx="120" cy="47.7" r="4"/><circle cx="180" cy="58.7" r="4"/>
      <circle cx="240" cy="53.7" r="4"/><circle cx="300" cy="56.3" r="4"/><circle cx="360" cy="84.1" r="4"/><circle cx="420" cy="88.2" r="4"/>
    </g>
    <g class="dot dprose">
      <circle cx="60" cy="139.9" r="4"/><circle cx="120" cy="148.6" r="4"/><circle cx="180" cy="144.3" r="4"/>
      <circle cx="240" cy="146.1" r="4"/><circle cx="300" cy="145.0" r="4"/><circle cx="360" cy="172.3" r="4"/><circle cx="420" cy="172.9" r="4"/>
    </g>
    <text x="128" y="42" class="t">250,5</text>
    <text x="68" y="158" class="t">136,3</text>
    <text x="64" y="186" class="t2">97,6</text>
